[project]
name = "swarm-alignment"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_alignment"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Notebooks put src/ on sys.path before importing, and hold exploratory plotting code.
"notebooks/*" = ["E402", "E501", "B007", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
modal = [
    "modal>=1.6.3",
]
notebook = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
]
plot = [
    "matplotlib>=3.11.2",
]
